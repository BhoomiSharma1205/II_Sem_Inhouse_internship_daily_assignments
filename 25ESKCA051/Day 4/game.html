<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            position:relative;
            height:100vh;
            margin:0;
        }
        img{
            width:100px;
            position:relative;
            cursor:pointer;
        }
        #timer{
            font-size:30px;
            font-weight:bold;
            color:red;
            cursor:pointer;
            margin:10px;
        }
    </style>
</head>
<body>

    <h2 id="timer">01:00</h2>

    <p>Apple: <span id="apple">0</span></p>
    <p>Banana: <span id="banana">0</span></p>

    <img src="https://img.magnific.com/free-vector/apple-colorful-vector-design_341269-1123.jpg?semt=ais_hybrid&w=740&q=80" onclick="clickImage('apple',this)">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg" onclick="clickImage('banana',this)">

    <script>
        let apple=0,banana=0;

        let timeLeft=60;
        let timer;
        let gameRunning=false;

        document.addEventListener("click", function () {
    if (!gameRunning) {
        startGame();
    }
});

        document.querySelectorAll("img").forEach(img=>{
            img.style.left=Math.random()*(window.innerWidth-100)+"px";
            img.style.top=Math.random()*(window.innerHeight-120)+"px";
        });

        function startGame(){
            clearInterval(timer);

            apple=0;
            banana=0;
            timeLeft=60;
            gameRunning=true;

            document.getElementById("apple").innerText=apple;
            document.getElementById("banana").innerText=banana;
            document.getElementById("timer").innerText="01:00";

            timer=setInterval(function(){

                timeLeft--;

                let min=Math.floor(timeLeft/60);
                let sec=timeLeft%60;

                document.getElementById("timer").innerText=
                String(min).padStart(2,'0')+":"+String(sec).padStart(2,'0');

                if(timeLeft<=0){
                    clearInterval(timer);
                    gameRunning=false;
                    alert("Time's Up!");
                }

            },1000);
        }

        function clickImage(type,img){

            if(!gameRunning) return;

            if(type=="apple"){
                document.getElementById("apple").innerText=++apple;
            }else{
                document.getElementById("banana").innerText=++banana;
            }

            img.style.left=Math.random()*(window.innerWidth-100)+"px";
            img.style.top=Math.random()*(window.innerHeight-120)+"px";
        }

    </script>
</body>
</html>
