<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">Student Records</h2>

    <input type="text" id="search" class="form-control mb-4"
    placeholder="Search Student">

    <div class="row" id="container"></div>

    <h4 class="mt-5">JSON Data (CGPA Hidden)</h4>
    <pre id="json"></pre>

</div>

<script>

const students = [

                {name:"Anamika",branch: "AI", cgpa:9.2,photo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvKOH4mCIljKDlYwHQHqTQVg4X-Rq8Be_4PvAKlLElhY510RZAsVIMHF4&s=10"},
                 { name:"Bhoomi",branch: "CSE", cgpa:9.6 ,photo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYrLZAGIoYCitVs0SQ-PpG2YE4jJ7O-eS7JAMjObmTgtrz6Y30vaFHG10&s=10"},
                 { name:"Chandan",branch: "AI", cgpa:9.0, photo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAxxgVQ5dYhJcgwSBbYuMZnAdOMVk0dqmiG4uvZ4P9pg&s=10"},
                 { name:"Divyanshu",branch: "AI", cgpa:9.5, photo:"https://media.licdn.com/dms/image/v2/D5603AQGX2DLecK2rwg/profile-displayphoto-scale_400_400/B56Z4IE7wqH4Ag-/0/1778251983405?e=1785369600&v=beta&t=gbI7OZZDFjR9j41rBw_dMrff3CMU-7Ng3WVfBJeUdWI"},
                 { name:"Eha",branch: "AI", cgpa:9.2, photo:"https://pbs.twimg.com/media/EeUI99bUcAMiRFa.jpg"},
                 {name:"Garima",branch: "AI", cgpa:9.2, photo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlg5GTGRHUCYi2Yn0c4zEJthqbuRAjvemdig1uDr_Woj5zvgNT0tPZCNA&s=10"},
                 {name:"Himanshu",branch: "AI", cgpa:9.0, photo:"https://imgcdn.stablediffusionweb.com/2024/2/24/88cfa19b-b263-4599-a1c5-bb34eb13eb9c.jpg"},
                 { name:"Khushi",branch: "CSE", cgpa:8.9, photo:"https://i.pinimg.com/736x/a7/3a/7a/a73a7af4f6a56ee51df04685ee049149.jpg"},
                 { name:"Lakshit",branch: "ECE", cgpa:8.0, photo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMP2zNv3QBEBAl9uzAEAqtaBF435xYvbUMsV6b94uQWYrr9bj8OfV4DxiU&s=10"},
                 { name:"Mohan",branch: "IOT", cgpa:8.5, photo:"https://dpsbathinda.com/wp-content/uploads/2021/07/3.jpg"},

];

let html="";

for(let i=0;i<students.length;i++){

html += `

<div class="col-md-4 mb-4 card-item">

<div class="card shadow">

<div class="card-body text-center">

<img src="${students[i].photo}"
width="120"
height="120"
class="rounded-circle mb-3">

<h4>${students[i].name}</h4>

<button class="btn btn-primary btn-sm"
onclick="toggleDetails(this)">
Show Details
</button>

<div class="details mt-3" style="display:none">

<p><strong>Branch:</strong> ${students[i].branch}</p>

<p><strong>CGPA:</strong> ${students[i].cgpa}</p>

</div>

</div>

</div>

</div>

`;

}

document.getElementById("container").innerHTML=html;

function toggleDetails(button){

let details=button.nextElementSibling;

if(details.style.display=="none"){

details.style.display="block";
button.innerHTML="Hide Details";

}
else{

details.style.display="none";
button.innerHTML="Show Details";

}

}

document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toLowerCase();

let cards=document.getElementsByClassName("card-item");

for(let i=0;i<cards.length;i++){

let name=students[i].name.toLowerCase();

if(name.includes(value))
cards[i].style.display="block";
else
cards[i].style.display="none";

}

});

function replace(key,value){

if(key=="cgpa")
return undefined;

return value;

}

document.getElementById("json").innerHTML=
JSON.stringify(students,replace,4);

</script>

</body>
</html>
